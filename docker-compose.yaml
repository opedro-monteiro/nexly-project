services:
  postgres:
    image: bitnami/postgresql:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRESQL_USERNAME: nexly
      POSTGRESQL_PASSWORD: postgres
      POSTGRESQL_DATABASE: nexly-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexly -d nexly-db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/bitnami/postgresql

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    ports:
      - "3333:3333"
    environment:
      PORT: "3333"
      DATABASE_URL: "postgresql://nexly:postgres@postgres:5432/nexly-db"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3333"
    ports:
      - "3000:3000"
    environment:
      API_URL: "http://api:3333"
      NEXT_PUBLIC_API_URL: "http://localhost:3333"
    depends_on:
      - api

volumes:
  postgres_data:
